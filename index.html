<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetryl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&family=JetBrains+Mono:ital,wght@0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWrapper" class="flex flex-row items-center justify-center gap-8 p-4 w-full max-w-6xl relative z-10">
    
    <div class="flex flex-col gap-4 w-48 items-end fade-panel opacity-0" id="leftPanel">
        <div class="glass p-4 rounded-2xl w-full text-center">
            <p class="text-[10px] font-black uppercase tracking-widest text-sky-400 opacity-60">Hold</p>
            <canvas id="holdCanvas" width="80" height="80" class="mt-2 mx-auto"></canvas>
        </div>
        <div class="glass p-5 rounded-2xl w-full">
            <div id="timerContainer" class="mb-4">
                <p id="timerTitle" class="text-[10px] font-bold uppercase opacity-40 text-right">Timer</p>
                <p id="timerLabel" class="text-3xl mono-bold text-sky-400 text-right leading-none">0:00</p>
            </div>
            
            <p class="text-[10px] font-bold uppercase opacity-40 text-right">Score</p>
            <p id="scoreLabel" class="text-2xl mono-bold text-white text-right leading-none">0</p>
            
            <div class="mt-4">
                <p class="text-[10px] font-bold uppercase opacity-40 text-right">PPS</p>
                <p id="ppsLabel" class="text-xl mono-bold text-white text-right leading-none">0.00</p>
            </div>

            <div id="b2bContainer" class="mt-4 opacity-0 transition-opacity flex flex-col items-end">
                <p class="text-[9px] font-black text-amber-400 uppercase tracking-tighter">Back-to-Back</p>
                <p id="b2bLabel" class="text-2xl mono-bold text-amber-400 leading-none">x1</p>
            </div>

            <div id="comboContainer" class="mt-4 opacity-0 transition-opacity flex flex-col items-end">
                <p class="text-[10px] font-bold text-rose-400 uppercase">Combo</p>
                <p id="comboLabel" class="text-3xl mono-italic text-rose-400">0x</p>
            </div>
        </div>
        <div class="flex flex-col gap-1 items-end opacity-20 mono text-[10px] uppercase font-bold tracking-tighter text-right" id="controlsHint">
            <p>P: Pause | R: Restart</p>
        </div>
    </div>

    <div class="relative" id="shakeContainer">
        <div id="boardFlash" class="absolute inset-0 pointer-events-none z-10 rounded-xl"></div>
        <div class="board-container fade-panel opacity-0" id="boardContainer">
            <canvas id="tetrylCanvas" width="300" height="600"></canvas>
        </div>
    </div>

    <div class="flex flex-col gap-4 w-48 fade-panel opacity-0" id="rightPanel">
        <div class="glass p-4 rounded-2xl w-full text-center">
            <p class="text-[10px] font-black uppercase tracking-widest text-sky-400 opacity-60">Next</p>
            <canvas id="nextCanvas" width="80" height="420" class="mt-2 mx-auto"></canvas>
        </div>
    </div>
</div>

<div id="mainMenu" class="overlay-menu absolute inset-0 z-50 flex flex-col items-center justify-center">
    <h1 class="text-6xl font-black tracking-widest mb-12 drop-shadow-lg text-white">TETRYL</h1>
    <div class="flex flex-col gap-3 w-64">
        <button onclick="startGame(60)" class="btn-primary py-3 rounded-xl uppercase tracking-widest text-sm shadow-xl shadow-sky-500/20">Bullet</button>
        <div class="flex gap-2">
            <button onclick="startGame('cheese')" class="btn-danger py-3 rounded-xl uppercase tracking-widest text-xs flex-1 shadow-xl shadow-rose-500/20">Cheese?</button>
            <button onclick="startGame('spike')" class="btn-danger py-3 rounded-xl uppercase tracking-widest text-xs flex-1 shadow-xl shadow-red-500/20">Spike!</button>
        </div>
        <div class="flex gap-2">
            <button onclick="startGame('quicksort')" class="btn-primary py-3 rounded-xl uppercase tracking-widest text-[10px] flex-1 shadow-xl shadow-purple-500/20" style="background-color: #a855f7;">Quicksort</button>
            <button onclick="startGame('livesort')" class="btn-primary py-3 rounded-xl tracking-widest text-[10px] flex-1 shadow-xl shadow-fuchsia-500/20" style="background-color: #a855f7;">quICksOrT</button>
        </div>
        <button onclick="startGame('phantom')" class="btn-primary py-3 rounded-xl uppercase tracking-widest text-sm shadow-xl shadow-indigo-500/20" style="background-color: #6366f1;">Phantom</button>
        <button onclick="startGame('zen')" class="btn-primary py-3 rounded-xl uppercase tracking-widest text-sm shadow-xl shadow-sky-500/20" style="background-color: #d946ef;">Zen Mode</button>
        <button onclick="document.getElementById('settingsModal').classList.remove('hidden')" class="glass font-black py-3 rounded-xl uppercase tracking-widest text-sm mt-2 hover:bg-white/10 transition-colors">Settings</button>
    </div>
</div>

<div id="countdownOverlay" class="absolute inset-0 z-40 hidden flex items-center justify-center pointer-events-none">
    <h2 id="countdownText" class="text-8xl font-black italic text-white drop-shadow-2xl scale-150 opacity-0 transition-all duration-300">READY</h2>
</div>

<div id="pauseMenu" class="overlay-menu absolute inset-0 z-40 hidden flex flex-col items-center justify-center rounded-xl mx-auto w-[308px] h-[608px] mt-[calc(50vh-304px)]">
    <h2 class="text-4xl font-black tracking-widest mb-8 text-white">PAUSED</h2>
    <div class="flex flex-col gap-3 w-48">
        <button onclick="togglePause()" class="btn-primary py-4 rounded-xl uppercase tracking-widest text-sm shadow-xl shadow-sky-500/20">Resume</button>
        <button onclick="triggerRestart()" class="btn-secondary py-4 rounded-xl uppercase tracking-widest text-sm">Restart</button>
        <button onclick="document.getElementById('settingsModal').classList.remove('hidden')" class="btn-secondary py-4 rounded-xl uppercase tracking-widest text-sm">Settings</button>
        <button onclick="goToMainMenu()" class="glass font-black py-4 rounded-xl uppercase tracking-widest text-sm hover:bg-white/10 transition-colors mt-2">Main Menu</button>
    </div>
</div>

<div id="resultMenu" class="overlay-menu absolute inset-0 z-50 hidden flex flex-col items-center justify-center">
    <h2 class="text-5xl font-black tracking-widest mb-2 text-white">FINISHED</h2>
    
    <div class="glass p-8 rounded-3xl w-80 text-center my-8 flex flex-col gap-4">
        <div>
            <p id="resScoreTitle" class="text-[10px] font-bold uppercase opacity-50 mb-1">Final Score</p>
            <p id="resScore" class="text-5xl mono-bold text-sky-400">0</p>
        </div>
        
        <div id="resSecondaryScoreContainer" class="hidden">
            <p class="text-[10px] font-bold uppercase opacity-50 mb-1">Points Scored</p>
            <p id="resSecondaryScore" class="text-2xl mono-bold text-white">0</p>
        </div>
        
        <div id="hsAlert" class="hidden bg-amber-500/20 text-amber-400 text-xs font-black uppercase tracking-widest py-2 rounded-lg border border-amber-500/30">
            New High Score!
        </div>
        
        <div id="prevBestContainer" class="opacity-60">
            <p class="text-[9px] font-bold uppercase mb-1">Previous Best</p>
            <p id="prevBestScore" class="text-xl mono-bold text-cyan-200">0</p>
        </div>

        <div class="flex justify-between border-t border-white/10 pt-4 mt-2">
            <div>
                <p class="text-[10px] font-bold uppercase opacity-50">Lines</p>
                <p id="resLines" class="text-2xl mono-bold">0</p>
            </div>
            <div>
                <p class="text-[10px] font-bold uppercase opacity-50">PPS</p>
                <p id="resPps" class="text-2xl mono-bold">0.00</p>
            </div>
        </div>
    </div>

    <div class="flex flex-col gap-3 w-64">
        <button onclick="triggerRestart()" class="btn-primary py-4 rounded-xl uppercase tracking-widest text-sm shadow-xl shadow-sky-500/20">Restart</button>
        <button onclick="goToMainMenu()" class="glass font-black py-4 rounded-xl uppercase tracking-widest text-sm hover:bg-white/10 transition-colors">Main Menu</button>
    </div>
</div>

<div id="settingsModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-md">
    <div class="glass p-10 rounded-3xl w-96 flex flex-col gap-6">
        <h2 class="text-xl font-black uppercase tracking-widest text-sky-400 text-center">Settings</h2>
        <div class="space-y-6">
            <div>
                <label class="text-[10px] font-bold uppercase opacity-50 block mb-2">DAS (ms)</label>
                <input type="number" id="dasInput" value="167" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm mono-bold text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase opacity-50 block mb-2">ARR (ms)</label>
                <input type="number" id="arrInput" value="33" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm mono-bold text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase opacity-50 block mb-2">DCD (ms)</label>
                <input type="number" id="dcdInput" value="33" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm mono-bold text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase opacity-50 block mb-2">SDS (ms)</label>
                <input type="number" id="sdsInput" value="0" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm mono-bold text-white focus:outline-none focus:border-sky-500">
            </div>
        </div>
        <button onclick="saveSettings()" class="btn-primary font-black py-4 rounded-2xl text-xs uppercase tracking-widest mt-4">Save & Close</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
